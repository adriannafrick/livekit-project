[project]
name = "livekit-minimal-voice-agent"
version = "0.1.0"
description = "A minimal LiveKit voice agent using OpenAI and Silero VAD"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai]~=1.8",
    "livekit-plugins-silero~=1.2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
